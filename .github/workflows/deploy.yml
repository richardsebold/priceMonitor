name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts resolves DATABASE_URL just to load the config, even for
      # `prisma generate` (postinstall) which never opens a real connection. No
      # real database is touched in this workflow, so a placeholder is enough.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build
